services:
  # ── Frontend static site on Render ──────────────────────────────────────────
  - type: web
    name: aripan-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false          # Set this to your Vercel backend URL in Render dashboard
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # Serve the admin panel's own static files — must come BEFORE the SPA catch-all
      - type: rewrite
        source: /aripan-admin-secure
        destination: /aripan-admin-secure/index.html
      - type: rewrite
        source: /aripan-admin-secure/*
        destination: /aripan-admin-secure/index.html
      # SPA catch-all — all other paths go to the React app
      - type: rewrite
        source: /*
        destination: /index.html
