services:
  # ── Full-Stack Web Service on Render (React frontend + Admin panel + Express API) ──
  - type: web
    name: aripan
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@aripan.art
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true

